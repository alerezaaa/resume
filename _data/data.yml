career-profile:
    title: Career Profile
    summary: |
      Resourceful engineer who enjoys coding, exploration, and solving real-world problems through creative, practical thinking. 
      Especially interested in applied research and development, using machine learning, computer vision, and software tools to 
      turn technical ideas into reliable, deployable solutions. Holds an M.Sc. from the University of Tehran with a thesis on machine 
      learning for computational imaging — refinement of reconstructions of ECT, an ill-posed inverse problem. Also experienced 
      in co-developing a real-time computer vision system deployed into industrial operation on embedded Linux, and currently 
      building deep-learning pipelines for crack detection in surface imagery.

education:
    title: Education
    info:
      - degree: M.Sc. in Biosystems Engineering
        university: University of Tehran
        time: 2020/10 - 2023/10
        details: |
            - <b>Grade&#58;</b> 16.70/20
            - <b>Thesis&#58;</b> Machine Learning–Based Image Reconstruction Refinement in Electrical Capacitance Tomography, an ill-posed inverse problem.
            - <b>Supervisor&#58;</b> <a href="https://scholar.google.com/citations?user=KnMXOMQAAAAJ&hl=en">Dr. Hossein Mousazadeh</a>
            - <b>Co-supervisors&#58;</b> <a href="https://scholar.google.com/citations?user=OjQxBngAAAAJ&hl=en">Dr. Soleiman Hosseinpour</a> <a href="https://www.linkedin.com/in/soleiman-hosseinpour-5856191ab/"><i class="fab fa-linkedin"></i></a> and <a href="https://scholar.google.dk/citations?user=c0Ee4oIAAAAJ&hl=en">Dr. Hadi Karimi</a> <a href="https://www.linkedin.com/in/hadi-karimi-77865b87/"><i class="fab fa-linkedin"></i></a>
            - Proposed and developed within a Port & Maritime Organization–funded ECT pipeline-monitoring project.
            - Across separate best-performing configurations, test-set R² reached 0.87 and test-set RMSE was as low as 0.147.
            - <b>Highlighted Courses&#58;</b> Artificial Intelligence, Finite Element Analysis, Advanced Control Systems
      
      - degree: BSc in Biosystems Engineering
        university: Tabriz University
        time: 2016/09 - 2020/09
        details: |
            - <b>Grade&#58;</b> 15.11/20
            - <b>Ranking&#58;</b> Ranked 9th in a cohort of 36 students.
            - Collaborated on the design and structural analysis of a scissor jack using SolidWorks and Ansys, achieving the highest score in the Mechanical Engineering Design course; following this success, the instructor suggested tackling a real-world problem, leading the team to develop a basil-harvesting machine concept for small-plot farms.

experiences:
    title: Experiences
    info:
      - role: IT Support Specialist
        time: 2024/06 - 2026/04
        company: <a href="https://ut.ac.ir/en"><b>University of Tehran</b></a>, Central Library, College of Agriculture and Natural Resources
        details: |
            <i>Amrieh — Iran's mandatory alternative to military service</i>
            - Built a semi-automated data-entry system in Google Apps Script, reducing manual paperwork for library staff.
            - Provided IT and network support, and delivered training in common software tools and basic computer literacy to staff and students.
            
      - role: Undergraduate Research Assistant, Precision Agriculture Lab
        time: 2019/03 - 2021/04
        company: <a href="https://tabrizu.ac.ir/en"><b>Tabriz University</b></a>, <a href="https://www.linkedin.com/company/precision-agriculture-research-team/posts/?feedView=all">Precision Agriculture group</a> (Biosystems Engineering department)
        details: |
          Volunteer position, supervised by <a href="https://www.researchgate.net/profile/Hossein-Navid">Prof. Hossein Navid</a> <a href="https://www.linkedin.com/in/hossein-navid-0915822a6/"><i class="fab fa-linkedin"></i></a> and <a href="https://scholar.google.dk/citations?user=c0Ee4oIAAAAJ&hl=en">Prof. Hadi Karimi</a> <a href="https://www.linkedin.com/in/hadi-karimi-77865b87/"><i class="fab fa-linkedin"></i></a>. <br>
          <i>(continued part-time remotely after Sep 2020)</i>
            - Co-developed a <b>real-time computer vision system for automated pipe cutting</b> by identifying flat surface regions, deployed in industrial operation and integrated with high-speed machinery.
                - Designed and integrated the <b>hardware and electronic circuits</b> for the real-time vision system, including Raspberry Pi interfacing.
                - Configured the <b>Raspberry Pi deployment end-to-end</b>, setting up the Linux environment, Python dependencies, and GPIO pin control for hardware communication.
            - Collaborated on a <b>wireless remote-control system for a silage-block-cutting machine</b> to improve operator safety.
                - Responsible for <b>electronic circuit design</b> and integration with pneumatic and hydraulic valve systems for precise actuation.
                - Developed the <b>Arduino-based control firmware</b> and hardware-side logic for executing TCP/UDP commands.


certifications:
      title: Certifications &amp; Training
      list:
        - name: CS50's Introduction to Computer Science (CS50x)
          start: 2026
          end: 2026
          organization: Harvard University
          credentialid: 
          credentialurl: https://cs50.harvard.edu/certificates/9b679a6e-6bd0-4ea1-b956-f7473696e9d2
          credentialname: Harvard certification
          details: |
            A rigorous, self-paced online course offered by Harvard University and taught by Prof. David J. Malan. 
            It covers fundamental computer science concepts including algorithms, data structures, memory management, and web development through hands-on problem sets in C, Python, SQL, and JavaScript. 
            The course is equivalent to Harvard's on-campus CS50 and is one of the most widely taken CS courses globally, recognized for its depth and demanding project-based assessments.

        - name: Machine Learning in Python with scikit-learn
          start: 2023
          end: 2023
          organization: Inria / France Université Numérique
          credentialid: 454d416de1e0ee727dd97fbd81fa89362c3d5230
          credentialurl: openbadgefactory.com/v1/assertion/454d416de1e0ee727dd97fbd81fa89362c3d5230.html
          credentialname: Inria
          details: |
            An in-depth MOOC taught by scikit-learn core developers at Inria, focusing on practical predictive modeling. 
            It covers the complete machine learning pipeline, including model selection, hyperparameter tuning, performance evaluation, and the implementation of linear, tree-based, and ensemble algorithms using Python.

        - name: Machine Learning
          start: 2022
          end: 2022
          organization: Stanford University
          credentialid: BEYRHUN8XPLX
          credentialurl: www.coursera.org/account/accomplishments/certificate/BEYRHUN8XPLX
          credentialname: Coursera certification
          details: |
            Taught by AI pioneer Andrew Ng, this foundational course covers machine learning, data mining, and statistical pattern recognition.
            It provides practical implementation of supervised and unsupervised algorithms (including SVMs, neural networks, and clustering) alongside industry best practices for model evaluation and real-world AI applications.


projects:
    title: Projects
    intro: >
      <b>Selected projects showcasing applied skills in machine learning, computer vision, and software development.</b>
      
    assignments:
      - title: Deep Learning for Surface Crack Segmentation
        link: "#"
        tagline: |
            Independent project developing a PyTorch-based pipeline for detecting cracks in concrete-surface images.<br>
                - Developing a PyTorch-based pipeline for detecting cracks in concrete-surface images.<br>
                - Using the Kaggle Surface Crack Detection dataset to build foundational computer-vision and deep-learning skills, with plans to extend the work toward pixel-level segmentation.<br>
            <b>Skills:</b> PyTorch, Computer Vision, Deep Learning


      - title: Shrimp Aquaculture Data-Entry App
        link: "#"
        tagline: |
            <i>CS50x Final Project; first release of a broader aquaculture-management system.</i><br>
            A Python/Kivy mobile application for recording shrimp-farming data and storing records locally in SQLite.<br>
                - Completed a Python/Kivy mobile application for recording shrimp-farming data and storing records locally in SQLite.<br>
                - Implemented a Persian interface with RTL support and automated Android APK builds through GitHub Actions.<br>
            <b>Skills:</b> Python, Kivy, SQLite, GitHub Actions


