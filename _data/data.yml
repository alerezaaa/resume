career-profile:
    title: Career Profile
    summary: |
      Resourceful engineer who enjoys coding, exploration, and solving real-world problems through creative, practical thinking. 
      Especially interested in applied research and development, using machine learning, computer vision, and software tools to 
      turn technical ideas into reliable, deployable solutions. Holds an M.Sc. in Biosystems Engineering from the University of Tehran 
      with a thesis on machine learning for computational imaging — building MLP-based refinements of Electrical Capacitance Tomography (ECT) 
      reconstructions. Experienced in developing hardware and computer-vision prototypes on Raspberry Pi and Arduino, and building 
      cross-platform Python/Kivy applications.

education:
    title: Education
    info:
      - degree: M.Sc. in Biosystems Engineering
        university: University of Tehran
        time: 2020/10 - 2023/10
        details: |
            - <b>Thesis&#58;</b> Development of a machine learning algorithm to improve image reconstruction in an electrical capacitance tomography system.
            - Built an MLP-based refinement (Python, scikit-learn) of linear back-projection (LBP) and Tikhonov ECT reconstructions on about 4,800 simulated phantoms (577-element FEM mesh, 485 imaging elements).
            - The best of about 2,800 configurations, chosen by cross-validation, reached R² = 0.906 and RMSE = 0.134 (normalised), against best R² of about 0.85 for logistic regression and gradient boosting and 0.53 for k-NN.
            - <b>Selected Courses&#58;</b> Artificial Intelligence, Advanced Finite Element Method, Design and Analysis of Engineering Experiments, Computer-Aided Design (CAD), Automatic Control Systems, Advanced Instrumentation.
            <!-- - <b>Grade&#58;</b> 16.70/20 -->
            <!-- - <b>Supervisor&#58;</b> <a href="https://scholar.google.com/citations?user=KnMXOMQAAAAJ&hl=en">Dr. Hossein Mousazadeh</a> -->
            <!-- - <b>Co-supervisors&#58;</b> <a href="https://scholar.google.com/citations?user=OjQxBngAAAAJ&hl=en">Dr. Soleiman Hosseinpour</a> <a href="https://www.linkedin.com/in/soleiman-hosseinpour-5856191ab/"><i class="fab fa-linkedin"></i></a> and <a href="https://scholar.google.dk/citations?user=c0Ee4oIAAAAJ&hl=en">Dr. Hadi Karimi</a> <a href="https://www.linkedin.com/in/hadi-karimi-77865b87/"><i class="fab fa-linkedin"></i></a> -->
      
      - degree: B.Sc. in Biosystems Engineering
        university: Tabriz University
        time: 2016/09 - 2020/09
        details: |
            - <b>Course Project&#58;</b> Collaborated on the CAD design and structural finite-element analysis of a scissor jack (SolidWorks, Ansys), achieving the highest project score in the course. (Machine Elements Design II project)
            - <b>Course Project&#58;</b> Team concept design of a mechanical harvester for small-plot farms, as a follow-up to the scissor-jack project in the following semester. (Design of Harvesting Machinery project)
            - <b>Selected Courses&#58;</b> Computer Programming, Fundamentals of Electrical Engineering I & II, Machine Elements Design, Engineering Statistics, Differential Equations, Numerical Methods, Maintenance Engineering, Post-Harvest Technology and Storage, Industrial Drawing I & II (CAD).
            <!-- - <b>Grade&#58;</b> 15.11/20 -->
            <!-- - <b>Ranking&#58;</b> Ranked 9th in a cohort of 36 students. -->

experiences:
    title: Experiences
    info:
      - role: IT Support Specialist
        time: 2024/06 - 2026/04
        company: <a href="https://ut.ac.ir/en"><b>University of Tehran</b></a>, Central Library, College of Agriculture and Natural Resources (Tehran, Iran)
        details: |
            - Built a Google Apps Script tool that looks up each book by ISBN in WorldCat and fills a spreadsheet with its title, author, publisher and year. Entries were then checked by hand.
            - Maintained the library website and gave IT and network support for library operations.
            
      - role: Research Assistant - Volunteer
        time: 2019/03 - 2021/04
        company: <a href="https://tabrizu.ac.ir/en"><b>Tabriz University</b></a>, <a href="https://www.linkedin.com/company/precision-agriculture-research-team/posts/?feedView=all">Precision Agriculture Lab</a> (Tabriz, Iran)
        details: |
          Supervised by <a href="https://www.researchgate.net/profile/Hossein-Navid">Prof. Hossein Navid</a> <a href="https://www.linkedin.com/in/hossein-navid-0915822a6/"><i class="fab fa-linkedin"></i></a> and <a href="https://scholar.google.dk/citations?user=c0Ee4oIAAAAJ&hl=en">Dr. Hadi Karimi</a> <a href="https://www.linkedin.com/in/hadi-karimi-77865b87/"><i class="fab fa-linkedin"></i></a>. <br>
          <i>(continued part-time remotely after Sep 2020)</i>
            - Worked on a <b>laboratory prototype that uses a camera to find flat surface regions on pipes</b>, as a first design for automated pipe cutting. Set up and maintained the <b>Raspberry Pi platform</b> (Raspberry Pi OS, a Miniconda Python environment, the Pi camera) and contributed to the <b>OpenCV image-processing code</b>, which used classical methods. Designed the <b>hardware interface</b> between the Raspberry Pi, its camera and the machine electronics, and maintained the hardware and software.
            - Built the control side of a <b>phone-based remote control for a silage-block-cutting machine</b>&#58; <b>Arduino firmware in C</b> and circuits (relays, resistors, capacitors) that drive the actuators. The Arduino ran its own Wi-Fi hotspot, and the machine worked only while it was receiving commands from the phone.


certifications:
      title: Certifications &amp; Training
      list:
        - name: CS50's Introduction to Computer Science (CS50x)
          start: 2026
          end: 2026
          organization: Harvard University
          credentialid: 
          credentialurl: https://cs50.harvard.edu/certificates/9b679a6e-6bd0-4ea1-b956-f7473696e9d2
          credentialname: Harvard certification
          details: |
            A rigorous, self-paced online course offered by Harvard University and taught by Prof. David J. Malan. 
            It covers fundamental computer science concepts including algorithms, data structures, memory management, and web development through hands-on problem sets in C, Python, SQL, and JavaScript. 
            The course is equivalent to Harvard's on-campus CS50 and is one of the most widely taken CS courses globally, recognized for its depth and demanding project-based assessments.

        - name: Machine Learning in Python with scikit-learn
          start: 2023
          end: 2023
          organization: Inria / France Université Numérique
          credentialid: 454d416de1e0ee727dd97fbd81fa89362c3d5230
          credentialurl: openbadgefactory.com/v1/assertion/454d416de1e0ee727dd97fbd81fa89362c3d5230.html
          credentialname: Inria
          details: |
            An in-depth MOOC taught by scikit-learn core developers at Inria, focusing on practical predictive modeling. 
            It covers the complete machine learning pipeline, including model selection, hyperparameter tuning, performance evaluation, and the implementation of linear, tree-based, and ensemble algorithms using Python.

        - name: Machine Learning
          start: 2022
          end: 2022
          organization: Stanford University (Andrew Ng), Coursera
          credentialid: BEYRHUN8XPLX
          credentialurl: www.coursera.org/account/accomplishments/certificate/BEYRHUN8XPLX
          credentialname: Coursera certification
          details: |
            Taught by AI pioneer Andrew Ng, this foundational course covers machine learning, data mining, and statistical pattern recognition.
            It provides practical implementation of supervised and unsupervised algorithms (including SVMs, neural networks, and clustering) alongside industry best practices for model evaluation and real-world AI applications.


